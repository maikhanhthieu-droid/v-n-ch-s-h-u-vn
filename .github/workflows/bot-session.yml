name: Start Telegram Bot Session

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: Thời gian bot hoạt động
        required: true
        default: "30"
        type: choice
        options:
          - "15"
          - "30"
          - "60"

permissions:
  contents: read

concurrency:
  group: vn-equity-telegram-bot-session
  cancel-in-progress: false

jobs:
  bot-session:
    name: Bot active for ${{ inputs.duration_minutes }} minutes
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore bot state
        id: restore-state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/api_usage.json
            data/watchlists.json
            data/signal_state.json
            data/signal_ledger.json
            data/assistant_conversations.json
          key: vn-equity-bot-state-${{ github.run_id }}
          restore-keys: |
            vn-equity-bot-state-

      - name: Validate required secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS || secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          if not os.environ.get("TELEGRAM_BOT_TOKEN", "").strip():
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN Actions secret")
          raw_chat_ids = os.environ.get("TELEGRAM_ALLOWED_CHAT_IDS", "")
          chat_ids = [item.strip() for item in raw_chat_ids.split(",") if item.strip()]
          if not chat_ids:
              raise SystemExit(
                  "Missing TELEGRAM_ALLOWED_CHAT_IDS or fallback TELEGRAM_CHAT_ID Actions secret"
              )
          try:
              [int(item) for item in chat_ids]
          except ValueError as exc:
              raise SystemExit(
                  "Telegram allowed chat IDs must be comma-separated integers"
              ) from exc
          print("Telegram token and chat allowlist are configured.")
          PY

      - name: Run Telegram bot session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VNSTOCK_API_KEY: ${{ secrets.VNSTOCK_API_KEY }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS || secrets.TELEGRAM_CHAT_ID }}
          DATA_DIR: data
          GEMINI_GOOGLE_SEARCH: ${{ vars.GEMINI_GOOGLE_SEARCH || 'false' }}
          MODEL_COUNCIL_ENABLED: ${{ vars.MODEL_COUNCIL_ENABLED || 'false' }}
          GLM_MODEL: "glm-5.2"
          DEEPSEEK_MODEL: "deepseek-v4-flash"
          GEMINI_DAILY_BUDGET: "2"
          DEEP_DAILY_LIMIT: "1"
          SCAN_DAILY_LIMIT: "1"
          DAILY_SHORTLIST_LIMIT: "2"
          MAX_SIGNALS_PER_SCAN: "2"
          SCAN_WEEKDAYS: "0"
          MODEL_COUNCIL_DAILY_BUDGET: "1"
          MODEL_COUNCIL_ERROR_COOLDOWN: "900"
          RESEARCH_COMMAND_COOLDOWN: "60"
          SCAN_WORKERS: "2"
          SIGNAL_REQUIRE_BACKTEST: "true"
          SIGNAL_REQUIRE_DATED_HISTORY: "true"
          MAX_HISTORY_STALENESS_DAYS: "10"
          MIN_BACKTEST_RESOLVED: "8"
          MIN_BACKTEST_WIN_LOWER: "45"
          MIN_BACKTEST_EXPECTANCY_R: "0.05"
          MIN_BACKTEST_FILL_RATE: "40"
          BACKTEST_ROUND_TRIP_COST_PCT: "0.45"
        shell: bash
        run: |
          set +e
          duration="${{ inputs.duration_minutes }}"
          echo "Bot session is starting for ${duration} minutes."
          timeout --signal=TERM --kill-after=20s "${duration}m" python bot.py
          status=$?
          set -e
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "Bot session finished at the selected time limit."
            exit 0
          fi
          exit "$status"

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/api_usage.json
            data/watchlists.json
            data/signal_state.json
            data/signal_ledger.json
            data/assistant_conversations.json
          key: vn-equity-bot-state-${{ github.run_id }}
